<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>🎵 Musik buatan yanti</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: #ff0000;
      margin-bottom: 30px;
    }

    .form-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    input[type="text"], input[type="file"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 220px;
      font-size: 1em;
      background-color: #111;
      color: #fff;
    }

    button {
      padding: 10px 20px;
      background-color: #ff0000;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #cc0000;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 700px;
      margin: auto;
    }

    li {
      background-color: #111;
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .delete-btn {
      margin-top: 10px;
      background-color: #fff;
      color: #000;
    }

    .delete-btn:hover {
      background-color: #ccc;
    }
  </style>
</head>
<body>

  <h1>🎶 Musik Player Elegan</h1>

  <div class="form-container">
    <input type="text" id="title" placeholder="Judul Lagu">
    <input type="file" id="fileInput" accept="audio/*">
    <button onclick="addMusic()">Tambah Lagu</button>
  </div>

  <ul id="musicList"></ul>

  <script>
    const musicList = [];

    function addMusic() {
      const title = document.getElementById('title').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!title || !file) {
        alert('Judul dan file musik harus diisi!');
        return;
      }

      const url = URL.createObjectURL(file);
      const track = {
        id: Date.now(),
        title,
        url
      };

      musicList.push(track);
      document.getElementById('title').value = '';
      fileInput.value = '';
      renderMusic();
    }

    function deleteMusic(id) {
      const index = musicList.findIndex(track => track.id === id);
      if (index !== -1) {
        URL.revokeObjectURL(musicList[index].url);
        musicList.splice(index, 1);
        renderMusic();
      }
    }

    function renderMusic() {
      const list = document.getElementById('musicList');
      list.innerHTML = '';

      musicList.forEach(track => {
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>${track.title}</strong>
          <audio controls src="${track.url}"></audio>
          <br>
          <button class="delete-btn" onclick="deleteMusic(${track.id})">Hapus Lagu</button>
        `;
        list.appendChild(li);
      });
    }
  </script>

</body>
</html>
